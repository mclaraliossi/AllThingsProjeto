<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/form.css">
</head>
<body>
    <h1>Formulário de cadastro de Cliente</h1>
    <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}">

        <input type="hidden" name="idCliente" th:field="*{idCliente}">

        <label for="nomeCliente">Nome</label>
        <input type="text" id="nomeCliente" name="nomeCliente" th:field="*{nomeCliente}">

        <label for="enderecoCliente">Endereço</label>
        <input type="text" id="enderecoCliente" name="enderecoCliente" th:field="*{enderecoCliente}">

        <label for="cidadeCliente">Cidade</label>
        <input type="text" id="cidadeCliente" name="cidadeCliente" th:field="*{cidadeCliente}">

        <label for="estadoCliente">Estado</label>
        <input type="text" id="estadoCliente" name="estadoCliente" th:field="*{estadoCliente}">

        <label for="cepCliente">CEP</label>
        <input type="text" id="cepCliente" name="cepCliente" th:field="*{cepCliente}">

        <label for="cpfCliente">CNPJ</label>
        <input type="text" id="cpfCliente" name="cpfCliente" th:field="*{cpfCliente}">

        <label for="rgCliente">CNPJ</label>
        <input type="text" id="rgCliente" name="rgCliente" th:field="*{rgCliente}">

        <button class="btnSalvar" type="submit">Salvar o Fornecedor</button>

        
    </form>

    <p><a class="btnVoltar" th:href="@{/clientes/listar}">Voltar</a></p>
</body>
</html>
